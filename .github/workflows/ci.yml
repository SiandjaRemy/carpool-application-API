name: Django CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs if a new push happens on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Common ENV vars here to avoid repetition
    env:
      DJANGO_SETTINGS_MODULE: Carpool_System.settings.test
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: "False"
      LOCAL_REDIS_INSTANCE_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgres://carpool_test_user:carpool_test_pass@localhost:5432/carpool_test_db

    services:
      # Spin up a throwaway Postgres & redis for testing
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: carpool_test_user
          POSTGRES_PASSWORD: carpool_test_pass
          POSTGRES_DB: carpool_test_db
        ports: ["5432:5432"]
        # Health check options
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      # Check code style first. If this fails, CI stops immediately (saving time)
      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run migrations
        run: uv run python manage.py migrate

      # Run tests and generate coverage in one go
      - name: Run tests with coverage
        run: uv run pytest --cov=. --cov-report=xml --cov-report=term-missing -v --tb=short

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
